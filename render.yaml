# Render.com uchun tayyor sozlama (Blueprint).
#
# Render'da: New → Blueprint → repozitoriyani tanlang. Render shu faylni
# o'qib, veb-xizmat va bazani o'zi yaratadi.
#
# Telegram bot ALOHIDA xizmat emas: u webhook orqali shu veb-xizmatning
# ichida ishlaydi. Sababi — Render'ning bepul tarifida "Background Worker"
# berilmaydi. Deploydan keyin bir marta:
#
#     python manage.py set_webhook
#
# (Render → Shell yoki lokal kompyuterdan SITE_URL ni ko'rsatib.)

databases:
  - name: kutubxona-db
    databaseName: kutubxona
    user: kutubxona
    plan: free           # bepul baza 30 kundan keyin o'chadi — pastdagi eslatmaga qarang

services:
  - type: web
    name: kutubxona
    runtime: python
    plan: free
    region: frankfurt    # O'zbekistonga eng yaqin bepul mintaqa
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 120"
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Render o'zi tasodifiy kalit yaratadi — hech qayerda saqlash shart emas.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Bazaga ulanish satrini Render yuqoridagi bazadan olib qo'yadi.
      - key: DATABASE_URL
        fromDatabase:
          name: kutubxona-db
          property: connectionString

      # Administrator hisobi (build.sh dagi seed_admin uchun).
      - key: ADMIN_USERNAME
        value: Saidansaf
      - key: ADMIN_PASSWORD
        generateValue: true    # parolni Render panelidan ko'rasiz
      - key: ADMIN_EMAIL
        value: admin@kutubxona.uz

      # Bu ikkisini Render panelida o'zingiz to'ldirasiz (sync: false
      # degani "kodda saqlanmasin"). Bo'sh qolsa sayt baribir ishlaydi.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: AI_API_KEY
        sync: false

      # SITE_URL ko'rsatilmasa, Django Render bergan manzilni o'zi oladi
      # (RENDER_EXTERNAL_HOSTNAME). O'z domeningizni ulasangiz shu yerga yozing.
      - key: SITE_URL
        sync: false
