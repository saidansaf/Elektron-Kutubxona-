# Render.com uchun tayyor sozlama (Blueprint).
#
# Render'da: New → Blueprint → repozitoriyani tanlang. Render shu faylni
# o'qib, veb-xizmat va bazani o'zi yaratadi.
#
# Telegram bot ALOHIDA xizmat emas: u webhook orqali shu veb-xizmatning
# ichida ishlaydi. Sababi — Render'ning bepul tarifida "Background Worker"
# berilmaydi.
#
# Webhook server ko'tarilganda AVTOMATIK yoqiladi (AUTO_SET_WEBHOOK=1).
# Qo'lda hech narsa qilish shart emas — faqat TELEGRAM_BOT_TOKEN ni
# Render panelidagi Environment bo'limiga qo'ying.

databases:
  - name: kutubxona-db
    databaseName: kutubxona
    user: kutubxona
    plan: free           # bepul baza 30 kundan keyin o'chadi — pastdagi eslatmaga qarang

services:
  - type: web
    name: kutubxona
    runtime: python
    plan: free
    region: frankfurt    # O'zbekistonga eng yaqin bepul mintaqa
    buildCommand: "./build.sh"
    # Bepul tarifda protsessor kuchsiz (0.1 CPU), xotira esa 512 MB.
    # `gthread` shuning uchun tanlangan: so'rovlarimizning ko'p vaqti
    # kutish bilan o'tadi (baza, Telegram, AI). Oddiy `sync` ishchilarida
    # bitta kutayotgan so'rov qolganini ham to'sib turadi — sayt shundan
    # "osilib qolgandek" sekin tuyuladi.
    #
    # Ishchi BITTA. Ilgari ikkita edi va bu xato edi:
    #   * 0.1 CPU ni ikki jarayon bo'lishib oladi — ish tezlashmaydi,
    #     aksincha navbat kutish qo'shiladi;
    #   * har bir Django jarayoni ~150 MB oladi, ikkitasi 512 MB ning
    #     yarmidan ko'pini yeydi va xotira tugaganda Render jarayonni
    #     o'ldirib qayta ko'taradi — foydalanuvchi buni "sayt qotib
    #     qoldi" deb ko'radi.
    # Bitta ishchi + 8 ta oqim bir vaqtda 8 ta so'rovni eplaydi va
    # xotirani ikki barobar tejaydi.
    #
    # --max-requests: uzoq ishlagach xotira asta o'sadi, 512 MB da bu
    # sezilarli. Ishchi vaqti-vaqti bilan o'zini yangilab turadi.
    startCommand: >-
      gunicorn config.wsgi:application
      --workers 1 --threads 8 --worker-class gthread
      --timeout 120 --max-requests 800 --max-requests-jitter 80
    # Tekshiruv bosh sahifaga emas, yengil `/ping/` ga boradi: u bazaga
    # tegmaydi, ya'ni Render'ning har bir tekshiruvi bepul protsessorni
    # yemaydi.
    healthCheckPath: /ping/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Render o'zi tasodifiy kalit yaratadi — hech qayerda saqlash shart emas.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Server ko'tarilganda Telegram webhook'i o'zi yoqiladi.
      # Render'ning bepul tarifida "Shell" yo'q, ya'ni buyruqni qo'lda
      # yozib bo'lmaydi — shuning uchun bu avtomatik bo'lishi shart.
      - key: AUTO_SET_WEBHOOK
        value: "1"

      # Bazaga ulanish satrini Render yuqoridagi bazadan olib qo'yadi.
      - key: DATABASE_URL
        fromDatabase:
          name: kutubxona-db
          property: connectionString

      # Administrator hisobi (build.sh dagi seed_admin uchun).
      - key: ADMIN_USERNAME
        value: Saidansaf
      - key: ADMIN_PASSWORD
        generateValue: true    # parolni Render panelidan ko'rasiz
      - key: ADMIN_EMAIL
        value: admin@kutubxona.uz

      # Bu ikkisini Render panelida o'zingiz to'ldirasiz (sync: false
      # degani "kodda saqlanmasin"). Bo'sh qolsa sayt baribir ishlaydi.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: AI_API_KEY
        sync: false

      # To'lov tizimi. Standart holda "test": provayder saytiga chiqilmaydi,
      # o'zimizdagi sinov sahifasi ochiladi va haqiqiy pul yechilmaydi.
      # Payme/Click kaliti olingach "live" qilinadi va pastdagi
      # o'zgaruvchilar to'ldiriladi (docs/TOLOV.md).
      - key: PAYMENT_MODE
        value: "test"
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

      # SITE_URL ko'rsatilmasa, Django Render bergan manzilni o'zi oladi
      # (RENDER_EXTERNAL_HOSTNAME). O'z domeningizni ulasangiz shu yerga yozing.
      - key: SITE_URL
        sync: false
